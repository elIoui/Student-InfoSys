<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <!-- Google Icons & Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" />

    <!-- Internal CSS -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: url('../MEDIAS/bg.gif') center center / cover no-repeat;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Login container with blur effect */
        .signup-box {
            background: rgba(26, 26, 30, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 50px 40px;
            width: 380px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            transition: all 0.3s ease;
        }

        .signup-box:hover {
            border-color: rgba(102, 126, 234, 0.3);
            box-shadow: 0 12px 48px rgba(102, 126, 234, 0.2);
        }

        /* Title */
        h2 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 35px;
            font-weight: 700;
            font-size: 32px;
            letter-spacing: 0.5px;
        }

        /* Input box container */
        .box {
            background: rgba(40, 40, 50, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 14px 20px;
            margin-bottom: 18px;
            align-items: center;
            border-radius: 14px;
            display: flex;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .box:focus-within {
            border-color: rgba(102, 126, 234, 0.6);
            background: rgba(50, 50, 60, 0.6);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }

        .box .icon {
            font-family: 'Material Symbols Outlined';
            font-size: 22px;
            color: #e3dbdb;
            margin-right: 12px;
            transition: color 0.3s ease;
        }

        .box:focus-within .icon {
            color: #667eea;
        }

        .box input {        
            background: transparent;
            font-size: 15px;
            color: #f0f0f0;
            border: none;
            outline: none;
            flex: 1;
            font-family: 'Inter', sans-serif;
        }

        .box input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* Gradient Button */
        .btn-grad {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 30px auto 20px; 
            padding: 16px 30px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background-size: 200% auto;
            border-radius: 14px;
            display: block;
            border: none;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }

        .btn-grad::before {
            background: linear-gradient(135deg, rgba(240, 147, 251, 0.3) 0%, rgba(102, 126, 234, 0.3) 100%);
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            transition: left 0.5s ease;
        }

        .btn-grad:hover::before {
            left: 0;
        }

        .btn-grad:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(102, 126, 234, 0.6);
        }

        .btn-grad:active {
            transform: translateY(-1px);
        }

        /* Sign-up link */
        p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 400;
            margin-top: 20px;
        }

        a {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        a:hover {
            color: #f093fb;
            text-shadow: 0 0 8px rgba(240, 147, 251, 0.5);
        }

        /* Responsive */
        @media (max-width: 400px) {
            .login {
                width: 90%;
                padding: 35px 25px;
            }

            h2 {
                font-size: 28px;
            }
        }


    </style>
</head>

<body>
    <div class="signup-box">
        <h2>Create Account</h2>

        <form id="signupForm">
            <div class="box">
                <span class="icon">person</span>
                <input type="text" id="username" placeholder="Username" required>
            </div>

            <div class="box">
                <span class="icon">lock</span>
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <div class="box">
                <span class="icon">lock</span>
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
            </div>

            <button type="submit" class="btn-grad">Sign Up</button>
        </form>

        <p>Already have an account? <a href="logIn.html">Log in</a></p>
    </div>

    <!-- Internal JS -->
    <script>
        document.getElementById("signupForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const email = document.getElementById("username").value.trim(); // assuming username = email
        const password = document.getElementById("password").value.trim();
        const confirmPassword = document.getElementById("confirmPassword").value.trim();


        // Password validation
        const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
        if (!passwordRegex.test(password)) {
            alert("Password must be at least 8 characters, include uppercase, lowercase, number, and special character.");
            return;
        }

        // Confirm password check
        if (password !== confirmPassword) {
            alert("Passwords do not match!");
            return;
        }

        // Send data to server
        try {
            const response = await fetch("../php/signup.php", {
                method: "POST",
                body: new URLSearchParams({ username: email, password })
            });

            const result = await response.json();

            if (result.success) {
                alert("Account created successfully!");
                window.location.href = "logIn.html";
            } else {
                alert(result.message);
            }
        } catch (error) {
            alert("Error connecting to server.");
            console.error(error);
        }
});
</script>

</body>

</html>
